<div class="container-fluid">
  <div class="row">
    <div class="col">
      <mat-card>
        <mat-card-title-group>
          <mat-card-title>Table</mat-card-title>
        </mat-card-title-group>

        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <lib-smart-filter [(filter)]="filterObject" (filterChange)="onFilter()"></lib-smart-filter>
            </div>
          </div>

          <div class="d-flex justify-content-center" *ngIf="isLoading">
            <mat-spinner diameter="50"></mat-spinner>
          </div>

          <table mat-table [dataSource]="dataSource" [hidden]="isLoading" matSort (matSortChange)="onSort()"
          style="width: 100%">

            <ng-container matColumnDef="text">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Text</th>
              <td mat-cell *matCellDef="let item">{{ item.text }}</td>
            </ng-container>

            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Select</th>
              <td mat-cell *matCellDef="let item">{{ item.select }}</td>
            </ng-container>

            <ng-container matColumnDef="boolean">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Boolean</th>
              <td mat-cell *matCellDef="let item">{{ item.boolean }}</td>
            </ng-container>

            <ng-container matColumnDef="date1">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Date 1</th>
              <td mat-cell *matCellDef="let item">{{ item.date1 | date: 'MM/dd/yyyy' }}</td>
            </ng-container>

            <ng-container matColumnDef="date2">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Date 2</th>
              <td mat-cell *matCellDef="let item">{{ item.date2 | date: 'MM/dd/yyyy' }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns;"></tr>
          </table>
          
           <mat-paginator [pageSizeOptions]="[20, 50, 100]" (page)="onPage()" showFirstLastButtons>
          </mat-paginator>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
